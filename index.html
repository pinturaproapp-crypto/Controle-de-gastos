<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistoria Completa (Com Memória Real)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .map-container {
      position: relative;
      aspect-ratio: 1 / 1; 
      width: 100%;
      overflow: hidden;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
      background-color: #f9fafb;
      overflow-x: auto; 
      scroll-snap-type: x mandatory;
      display: flex;
    }
    .map-slide {
      min-width: 100%;
      height: 100%;
      scroll-snap-align: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
    }
    .photo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      width: 100%;
      height: 100%;
      background-color: #f3f4f6;
      transition: background 0.2s;
    }
    .photo-placeholder:hover { background-color: #e5e7eb; }
    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .has-photo .photo-placeholder { display: none; }
    .has-photo .photo-img { display: block; }
    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid white;
      font-size: 11px;
      font-weight: 600;
      background-color: white;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      pointer-events: none;
      font-family: monospace;
      font-variant-numeric: tabular-nums;
      z-index: 10;
    }
    .map-container::-webkit-scrollbar { display: none; }
    .map-container { -ms-overflow-style: none; scrollbar-width: none; }
    .damage-list-scroll {
      max-height: 400px; 
      overflow-y: auto;
      padding-right: 4px;
    }
    .damage-list-scroll::-webkit-scrollbar { width: 6px; }
    .damage-list-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .damage-list-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="p-4 bg-gray-50 min-h-screen">

  <div class="max-w-4xl mx-auto p-4 sm:p-6 bg-white rounded-lg shadow-sm space-y-8">
    
    <!-- 1. IDENTIFICAÇÃO E BOTÃO DE BACKUP -->
    <div>
      <div class="mb-4 flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="font-bold text-xl text-gray-900">Identifique-se</h2>
        <div class="flex items-center gap-2">
          <span class="text-[10px] uppercase tracking-[0.16em] text-gray-500">Vistoria de entrada</span>
          <button onclick="downloadBackup()" class="bg-gray-800 hover:bg-gray-900 text-white text-xs px-3 py-1.5 rounded-md flex items-center gap-1 transition">
            <i data-lucide="download" class="h-3 w-3"></i> Baixar Relatório
          </button>
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="vehicle-fields-container"></div>
    </div>

    <hr class="border-gray-200">

    <!-- 2. CHECKLIST -->
    <div id="checklist-sections-container" class="space-y-6"></div>

    <hr class="border-gray-200">

    <!-- 3. MAPA DE AVARIAS -->
    <div>
      <div class="mb-3 flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="font-bold text-xl text-gray-900">Mapa de avarias</h2>
        <span class="text-[10px] uppercase tracking-[0.16em] text-gray-500">Deslize e tire fotos</span>
      </div>

      <div class="mb-3 flex flex-wrap gap-1.5" id="damage-buttons"></div>

      <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
      
      <div class="map-container" id="damage-map">
        <div class="map-slide" data-view="frente">
          <div class="photo-placeholder" onclick="triggerCamera('frente')">
            <svg class="w-10 h-10 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <p class="font-medium text-sm">Tirar foto da Frente</p>
          </div>
          <img class="photo-img pointer-events-none" alt="Frente">
          <div class="pointer-events-none absolute inset-0 markers-layer"></div>
        </div>

        <div class="map-slide" data-view="lateral">
          <div class="photo-placeholder" onclick="triggerCamera('lateral')">
             <svg class="w-10 h-10 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <p class="font-medium text-sm">Tirar foto da Lateral</p>
          </div>
          <img class="photo-img pointer-events-none" alt="Lateral">
          <div class="pointer-events-none absolute inset-0 markers-layer"></div>
        </div>

        <div class="map-slide" data-view="traseira">
          <div class="photo-placeholder" onclick="triggerCamera('traseira')">
             <svg class="w-10 h-10 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <p class="font-medium text-sm">Tirar foto da Traseira</p>
          </div>
          <img class="photo-img pointer-events-none" alt="Traseira">
          <div class="pointer-events-none absolute inset-0 markers-layer"></div>
        </div>

        <div class="map-slide" data-view="topo">
          <div class="photo-placeholder" onclick="triggerCamera('topo')">
             <svg class="w-10 h-10 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <p class="font-medium text-sm">Tirar foto de Cima</p>
          </div>
          <img class="photo-img pointer-events-none" alt="Topo">
          <div class="pointer-events-none absolute inset-0 markers-layer"></div>
        </div>
      </div>

      <div class="mt-3 flex justify-center items-center gap-2" id="map-pagination">
        <span class="w-2 h-2 rounded-full bg-gray-800"></span>
        <span class="w-2 h-2 rounded-full bg-gray-200"></span>
        <span class="w-2 h-2 rounded-full bg-gray-200"></span>
        <span class="w-2 h-2 rounded-full bg-gray-200"></span>
      </div>
      <p class="mt-2 text-center text-[11px] text-gray-500">Frente · Lateral · Traseira · Vista Superior</p>
    </div>

    <hr class="border-gray-200">

    <!-- 4. LISTA DE AVARIAS -->
    <div>
      <div id="damage-list-container" class="damage-list-scroll"></div>
    </div>

  </div>

  <script>
    // ==========================================
    // DADOS
    // ==========================================
    const damageTypes = [
      { key: "risco", label: "Risco", color: "#B4791F" },
      { key: "amassado", label: "Amassado", color: "#2F6F8F" },
      { key: "trinca", label: "Trinca", color: "#7A4FA3" },
      { key: "quebrado", label: "Quebrado", color: "#B3402F" },
      { key: "ferrugem", label: "Ferrugem", color: "#8A5A2B" }
    ];
    const getTypeColor = (key) => (damageTypes.find(type => type.key === key) || damageTypes[0]).color;

    const campos = [
      { key: "placa", label: "Placa", placeholder: "ABC-1D23" },
      { key: "modelo", label: "Veículo / modelo", placeholder: "Gol 1.6 - 2019" },
      { key: "cor", label: "Cor", placeholder: "Prata" },
      { key: "cliente", label: "Cliente", placeholder: "Nome do cliente" },
      { key: "data", label: "Data", type: "date" },
      { key: "km", label: "Quilometragem", placeholder: "84.320" },
      { key: "responsavel", label: "Responsável", placeholder: "Quem conferiu" },
      { key: "os", label: "Ordem de serviço", placeholder: "OS 1042" },
    ];

    const checklistData = [
      { id: 'secao_1', title: 'Documentação e identificação', items: [
          { id: 'd1', label: 'Placa e chassi conferidos' },
          { id: 'd2', label: 'CRLV ou autorização conferido' },
          { id: 'd3', label: 'Chave, controle e manual' },
          { id: 'd4', label: 'Quilometragem registrada' },
          { id: 'd5', label: 'Nível de combustível' }
      ]},
      { id: 'secao_2', title: 'Lataria e pintura', items: [
          { id: 'l1', label: 'Avarias mapeadas' },
          { id: 'l2', label: 'Para-choques conferidos' },
          { id: 'l3', label: 'Capô e portas conferidas' },
          { id: 'l4', label: 'Frisos e emblemas' },
          { id: 'l5', label: 'Retrovisores e maçanetas' },
          { id: 'l6', label: 'Pontos de ferrugem' }
      ]},
      { id: 'secao_3', title: 'Vidros, rodas e iluminação', items: [
          { id: 'v1', label: 'Para-brisa e vidros' },
          { id: 'v2', label: 'Palhetas de limpadores' },
          { id: 'v3', label: 'Pneus, rodas e calotas' },
          { id: 'v4', label: 'Estepe, macaco e chave' },
          { id: 'v5', label: 'Faróis e lanternas' }
      ]},
      { id: 'secao_4', title: 'Interior e acessórios', items: [
          { id: 'i1', label: 'Estofamento e painéis' },
          { id: 'i2', label: 'Tapetes e acabamentos' },
          { id: 'i3', label: 'Itens pessoais retirados' },
          { id: 'i4', label: 'Documentos e objetos de valor' }
      ]},
      { id: 'secao_5', title: 'Mecânica e elétrica', items: [
          { id: 'm1', label: 'Níveis de óleo e água' },
          { id: 'm2', label: 'Bateria e terminais' },
          { id: 'm3', label: 'Luzes de painel' },
          { id: 'm4', label: 'Ar condicionado' },
          { id: 'm5', label: 'Rádio e multimídia' },
          { id: 'm6', label: 'Vidros elétricos' }
      ]},
      { id: 'secao_6', title: 'Fechamento da entrada', items: [
          { id: 'f1', label: 'Cliente ciente das avarias' },
          { id: 'f2', label: 'Orçamento aprovado' },
          { id: 'f3', label: 'Fotos anexadas' },
          { id: 'f4', label: 'Prazo de entrega combinado' }
      ]}
    ];

    // ==========================================
    // SISTEMA DE MEMÓRIA (LOCALSTORAGE)
    // ==========================================
    let vehicleData = JSON.parse(localStorage.getItem('vistoria_vehicleData')) || {}; 
    let checkedItems = JSON.parse(localStorage.getItem('vistoria_checkedItems')) || {}; 
    let marks = JSON.parse(localStorage.getItem('vistoria_marks')) || []; 
    let photos = JSON.parse(localStorage.getItem('vistoria_photos')) || { frente: null, lateral: null, traseira: null, topo: null };

    let selectedDamageType = 'risco'; 
    let currentPhotoView = 'frente'; 

    function saveData() {
      try {
        localStorage.setItem('vistoria_vehicleData', JSON.stringify(vehicleData));
        localStorage.setItem('vistoria_checkedItems', JSON.stringify(checkedItems));
        localStorage.setItem('vistoria_marks', JSON.stringify(marks));
        localStorage.setItem('vistoria_photos', JSON.stringify(photos));
      } catch (e) {
        alert("Aviso: A memória do navegador está cheia. Baixe o relatório para não perder os dados.");
      }
    }

    // ==========================================
    // RENDERIZAÇÃO INICIAL
    // ==========================================
    function renderVehicleFields() {
      const container = document.getElementById('vehicle-fields-container');
      container.innerHTML = campos.map(campo => `
        <label class="block">
          <span class="mb-1.5 block text-[10px] uppercase tracking-[0.16em] text-gray-500">${campo.label}</span>
          <input type="${campo.type || 'text'}" value="${vehicleData[campo.key] || ''}" placeholder="${campo.placeholder || ''}"
            oninput="vehicleData['${campo.key}'] = this.value; saveData();"
            class="w-full rounded-md border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-900 focus:border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-200" />
        </label>
      `).join('');
    }

    function renderChecklist() {
      const container = document.getElementById('checklist-sections-container');
      container.innerHTML = checklistData.map((section, idx) => {
        const doneCount = section.items.filter(i => checkedItems[i.id]).length;
        const allDone = doneCount === section.items.length;
        return `
          <section class="mb-6">
            <div class="mb-2 flex items-center justify-between border-b border-gray-200 pb-2">
              <h3 class="flex items-center gap-2.5 font-bold text-lg text-gray-900">
                <span class="flex h-6 w-6 items-center justify-center rounded-full bg-gray-100 text-[10px] text-gray-500">${String(idx + 1).padStart(2, "0")}</span>
                ${section.title}
              </h3>
              <div class="flex items-center gap-3">
                <span class="text-[11px] text-gray-500">${doneCount} / ${section.items.length}</span>
                <button onclick="toggleAll('${section.id}')" class="text-[10px] uppercase text-gray-500 hover:text-gray-900">${allDone ? 'Limpar' : 'Marcar todos'}</button>
              </div>
            </div>
            <ul>${section.items.map(item => `
              <li class="border-b border-gray-100 last:border-b-0">
                <label class="flex cursor-pointer items-start gap-3 py-2.5">
                  <input type="checkbox" ${checkedItems[item.id] ? 'checked' : ''} onchange="toggleItem('${item.id}')" class="mt-1 h-4 w-4 cursor-pointer accent-gray-900" />
                  <span class="text-[13.5px] ${checkedItems[item.id] ? 'text-gray-400 line-through' : 'text-gray-900'}">${item.label}</span>
                </label>
              </li>
            `).join('')}</ul>
          </section>
        `;
      }).join('');
    }

    window.toggleItem = (id) => { checkedItems[id] = !checkedItems[id]; saveData(); renderChecklist(); };
    window.toggleAll = (secId) => { 
      const sec = checklistData.find(s => s.id === secId);
      const all = sec.items.every(i => checkedItems[i.id]);
      sec.items.forEach(i => checkedItems[i.id] = !all);
      saveData();
      renderChecklist();
    };

    // ==========================================
    // UPLOAD E COMPRESSÃO DA FOTO
    // ==========================================
    const mapContainer = document.getElementById('damage-map');
    
    window.triggerCamera = (viewName) => {
      currentPhotoView = viewName;
      document.getElementById('camera-input').click();
    };

    window.handleImageUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // COMPRESSÃO DA IMAGEM: Redimensiona para no máximo 800px de largura/altura
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const MAX_HEIGHT = 800;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Converte para JPEG com qualidade 70% para ficar leve
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          
          photos[currentPhotoView] = compressedBase64;
          saveData(); // Salva na memória

          const slide = document.querySelector(`.map-slide[data-view="${currentPhotoView}"]`);
          if(slide) {
            slide.querySelector('.photo-img').src = compressedBase64;
            slide.classList.add('has-photo');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      
      event.target.value = ''; 
    };

    // ==========================================
    // MARCAÇÕES NO MAPA
    // ==========================================
    mapContainer.addEventListener('scroll', () => {
      const scrollLeft = mapContainer.scrollLeft;
      const width = mapContainer.offsetWidth;
      const activeIndex = Math.round(scrollLeft / width);
      
      document.querySelectorAll('#map-pagination span').forEach((dot, idx) => {
        dot.className = idx === activeIndex 
          ? "w-2 h-2 rounded-full bg-gray-800 transition-colors" 
          : "w-2 h-2 rounded-full bg-gray-200 transition-colors";
      });
    });

    document.querySelectorAll('.map-slide').forEach(slide => {
      slide.addEventListener('click', (event) => {
        if(event.target.closest('.photo-placeholder')) return;
        if(!slide.classList.contains('has-photo')) return;

        const rect = slide.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;
        
        marks.push({ 
          id: Date.now().toString(), 
          x: parseFloat(x.toFixed(2)), 
          y: parseFloat(y.toFixed(2)), 
          type: selectedDamageType,
          view: slide.getAttribute('data-view')
        });
        saveData();
        renderAllDamage();
      });
    });

    function renderDamageButtons() {
      const container = document.getElementById('damage-buttons');
      container.innerHTML = damageTypes.map(tipo => `
        <button type="button" onclick="selectedDamageType='${tipo.key}'; renderDamageButtons();"
          class="flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-[11px] font-medium transition-all ${
            selectedDamageType === tipo.key ? 'border-gray-400 bg-gray-100 text-gray-900' : 'border-gray-200 bg-white text-gray-500 hover:border-gray-300'
          }">
          <span class="h-2 w-2 rounded-full" style="background-color: ${tipo.color};"></span>
          ${tipo.label}
        </button>
      `).join('');
    }

    function loadSavedPhotos() {
      document.querySelectorAll('.map-slide').forEach(slide => {
        const view = slide.getAttribute('data-view');
        if (photos[view]) {
          slide.querySelector('.photo-img').src = photos[view];
          slide.classList.add('has-photo');
        }
      });
    }

    function renderMarks() {
      document.querySelectorAll('.markers-layer').forEach(layer => layer.innerHTML = '');
      
      marks.forEach((mark, index) => {
        const slide = document.querySelector(`.map-slide[data-view="${mark.view}"]`);
        if (slide) {
          const span = document.createElement('span');
          span.className = 'marker';
          span.style.left = `${mark.x}%`;
          span.style.top = `${mark.y}%`;
          span.style.borderColor = getTypeColor(mark.type);
          span.style.color = getTypeColor(mark.type);
          span.textContent = index + 1;
          slide.querySelector('.markers-layer').appendChild(span);
        }
      });
    }

    function renderDamageList() {
      const listContainer = document.getElementById('damage-list-container');
      listContainer.innerHTML = '';

      if (marks.length === 0) {
        listContainer.innerHTML = `<p class="mt-4 rounded-lg border border-dashed border-gray-300 px-3 py-3 text-center text-[12px] text-gray-500">Nenhuma variação marcada.</p>`;
        return;
      }

      const ul = document.createElement('ul');
      ul.className = "mt-4 space-y-2";

      marks.forEach((mark, index) => {
        const li = document.createElement('li');
        li.className = "flex items-center gap-3 rounded-lg border border-gray-200 bg-white px-3 py-2";

        const options = damageTypes.map(tipo => `<option value="${tipo.key}" ${mark.type === tipo.key ? 'selected' : ''}>${tipo.label}</option>`).join('');
        const viewNames = { 'frente': 'Frente', 'lateral': 'Lateral', 'traseira': 'Traseira', 'topo': 'Topo' };

        li.innerHTML = `
          <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border text-[11px] font-semibold tabular-nums" 
                style="border-color: ${getTypeColor(mark.type)}; color: ${getTypeColor(mark.type)};">${index + 1}</span>
          <span class="min-w-0 flex-1 truncate text-[13px] text-gray-900">Avaria ${index + 1} <span class="text-gray-400 text-[10px] ml-1">(${viewNames[mark.view]})</span></span>
          <select class="rounded-md border border-gray-200 bg-white px-2 py-1 text-[12px]" onchange="updateMarkType('${mark.id}', this.value)">${options}</select>
          <button type="button" onclick="removeMark('${mark.id}')" class="flex h-7 w-7 items-center justify-center rounded-md text-gray-400 hover:bg-gray-100 hover:text-gray-900"><i data-lucide="x" class="h-4 w-4"></i></button>
        `;
        ul.appendChild(li);
      });

      listContainer.appendChild(ul);
      lucide.createIcons(); 
    }

    window.updateMarkType = (id, newType) => {
      const mark = marks.find(m => m.id === id);
      if (mark) { mark.type = newType; saveData(); renderAllDamage(); }
    };

    window.removeMark = (id) => {
      marks = marks.filter(m => m.id !== id);
      saveData();
      renderAllDamage();
    };

    function renderAllDamage() {
      renderMarks();
      renderDamageList();
    }

    // ==========================================
    // BACKUP (BAIXAR RELATÓRIO)
    // ==========================================
    window.downloadBackup = function() {
      const reportData = {
        veiculo: vehicleData,
        checklist: checkedItems,
        avarias: marks,
        fotos: photos,
        dataGeracao: new Date().toISOString()
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reportData, null, 2));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", `vistoria_${vehicleData.placa || 'veiculo'}.json`);
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    };
