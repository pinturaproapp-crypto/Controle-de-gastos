<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistoria com Foto do Veículo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .map-container {
      position: relative;
      aspect-ratio: 1 / 1; 
      width: 100%;
      cursor: crosshair;
      overflow: hidden;
      border-radius: 0.5rem;
      border: 2px dashed #e5e7eb; /* Borda tracejada para indicar área de upload */
      background-color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-container.has-image {
      border: 1px solid #e5e7eb;
      background-color: #000; /* Fundo preto para fotos */
    }
    .map-image {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Preenche o quadrado sem distorcer */
      display: none;
    }
    .map-container.has-image .map-image {
      display: block;
    }
    .map-container.has-image .upload-placeholder {
      display: none;
    }
    
    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid white;
      font-size: 11px;
      font-weight: 600;
      background-color: white;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      pointer-events: none;
      font-family: monospace;
      font-variant-numeric: tabular-nums;
      z-index: 10;
    }

    .damage-list-scroll {
      max-height: 400px; 
      overflow-y: auto;
      padding-right: 4px;
    }
    .damage-list-scroll::-webkit-scrollbar { width: 6px; }
    .damage-list-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    .damage-list-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="p-4 bg-gray-50 min-h-screen">

  <div class="max-w-4xl mx-auto p-4 sm:p-6 bg-white rounded-lg shadow-sm space-y-8">
    
    <!-- (Checklist e Formulário mantidos iguais para focar no mapa) -->
    <div>
      <div class="mb-4 flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="font-bold text-xl text-gray-900">Identifique-se</h2>
        <span class="text-[10px] uppercase tracking-[0.16em] text-gray-500">Vistoria de entrada</span>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="vehicle-fields-container"></div>
    </div>

    <hr class="border-gray-200">
    <div id="checklist-sections-container" class="space-y-6"></div>
    <hr class="border-gray-200">

    <!-- MAPA DE AVARIAS COM FOTO -->
    <div>
      <div class="mb-3 flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="font-bold text-xl text-gray-900">Mapa de avarias (Foto Real)</h2>
        <span class="text-[10px] uppercase tracking-[0.16em] text-gray-500">Toque na foto para marcar</span>
      </div>

      <div class="mb-3 flex flex-wrap gap-1.5" id="damage-buttons"></div>

      <!-- Input de Arquivo Escondido (acionado pelo botão no mapa) -->
      <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
      
      <!-- Container do Mapa -->
      <div class="map-container" id="damage-map">
        
        <!-- Placeholder de Upload (Some quando a foto é carregada) -->
        <div class="upload-placeholder flex flex-col items-center justify-center text-gray-400 p-6 text-center cursor-pointer" onclick="document.getElementById('camera-input').click()">
          <svg class="w-12 h-12 mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <p class="font-medium text-sm">Tirar foto ou Anexar imagem</p>
          <p class="text-xs mt-1">Toque aqui para abrir a câmera</p>
        </div>

        <!-- A Imagem que será exibida -->
        <img id="uploaded-image" class="map-image pointer-events-none" alt="Foto do veículo">
        
        <!-- Camada dos Marcadores -->
        <div class="pointer-events-none absolute inset-0 markers-layer"></div>
      </div>

      <!-- Botão para trocar a foto (só aparece se já tiver foto) -->
      <div class="mt-2 text-center hidden" id="change-photo-container">
        <button onclick="document.getElementById('camera-input').click()" class="text-[11px] text-gray-500 hover:text-gray-900 font-medium underline">
          Trocar foto
        </button>
      </div>
      
      <p class="mt-2 text-center text-[11px] text-gray-500">Aponte os danos com precisão na foto real</p>
    </div>

    <hr class="border-gray-200">

    <!-- LISTA DE AVARIAS -->
    <div>
      <div id="damage-list-container" class="damage-list-scroll"></div>
    </div>

  </div>

  <script>
    // ==========================================
    // DADOS INICIAIS (Mantidos)
    // ==========================================
    const damageTypes = [
      { key: "risco", label: "Risco", color: "#B4791F" },
      { key: "amassado", label: "Amassado", color: "#2F6F8F" },
      { key: "trinca", label: "Trinca", color: "#7A4FA3" },
      { key: "quebrado", label: "Quebrado", color: "#B3402F" },
      { key: "ferrugem", label: "Ferrugem", color: "#8A5A2B" }
    ];
    const getTypeColor = (key) => (damageTypes.find(type => type.key === key) || damageTypes[0]).color;

    const campos = [
      { key: "placa", label: "Placa", placeholder: "ABC-1D23" },
      { key: "modelo", label: "Veículo", placeholder: "Gol 1.6" },
      { key: "cliente", label: "Cliente", placeholder: "Nome" },
      { key: "data", label: "Data", type: "date" }
    ];

    // (Checklist resumido no código para focar no mapa)
    const checklistData = [
      { id: 'secao_1', title: 'Documentação', items: [{ id: 'd1', label: 'CRLV em dia' }, { id: 'd2', label: 'Chave e manual' }] },
      { id: 'secao_2', title: 'Lataria', items: [{ id: 'l1', label: 'Para-choques' }, { id: 'l2', label: 'Capô e portas' }] }
    ];

    let vehicleData = {}; 
    let checkedItems = {}; 
    let selectedDamageType = 'risco'; 
    let marks = []; 

    // ==========================================
    // LÓGICA DE UPLOAD DA FOTO
    // ==========================================
    const mapContainer = document.getElementById('damage-map');
    const imageElement = document.getElementById('uploaded-image');
    const changePhotoContainer = document.getElementById('change-photo-container');
    
    // Função chamada quando a pessoa seleciona/tira a foto
    window.handleImageUpload = function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          // Coloca a imagem no fundo do mapa
          imageElement.src = e.target.result;
          // Adiciona classe para tirar o placeholder cinza
          mapContainer.classList.add('has-image');
          changePhotoContainer.classList.remove('hidden');
          
          // Limpa as marcas antigas (pois é uma foto nova)
          marks = [];
          renderAllDamage();
        };
        reader.readAsDataURL(file);
      }
    };

    // ==========================================
    // RENDERIZAÇÃO E CLIQUE NO MAPA
    // ==========================================
    function renderDamageButtons() {
      const container = document.getElementById('damage-buttons');
      container.innerHTML = damageTypes.map(tipo => `
        <button type="button" onclick="selectedDamageType='${tipo.key}'; renderDamageButtons();"
          class="flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-[11px] font-medium transition-all ${
            selectedDamageType === tipo.key ? 'border-gray-400 bg-gray-100 text-gray-900' : 'border-gray-200 bg-white text-gray-500 hover:border-gray-300'
          }">
          <span class="h-2 w-2 rounded-full" style="background-color: ${tipo.color};"></span>
          ${tipo.label}
        </button>
      `).join('');
    }

    // Clique para adicionar marcador na foto
    mapContainer.addEventListener('click', (event) => {
      // Se não tiver imagem carregada, não deixa marcar
      if (!mapContainer.classList.contains('has-image')) return;

      const rect = mapContainer.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;
      
      marks.push({ 
        id: Date.now().toString(), 
        x: parseFloat(x.toFixed(2)), 
        y: parseFloat(y.toFixed(2)), 
        type: selectedDamageType,
        view: 'foto' // Agora só temos a vista da foto
      });
      renderAllDamage();
    });

    function renderMarks() {
      const layer = document.querySelector('.markers-layer');
      layer.innerHTML = '';
      
      marks.forEach((mark, index) => {
        const span = document.createElement('span');
        span.className = 'marker';
        span.style.left = `${mark.x}%`;
        span.style.top = `${mark.y}%`;
        span.style.borderColor = getTypeColor(mark.type);
        span.style.color = getTypeColor(mark.type);
        span.textContent = index + 1;
        layer.appendChild(span);
      });
    }

    function renderDamageList() {
      const listContainer = document.getElementById('damage-list-container');
      listContainer.innerHTML = '';

      if (marks.length === 0) {
        listContainer.innerHTML = `<p class="mt-4 rounded-lg border border-dashed border-gray-300 px-3 py-3 text-center text-[12px] text-gray-500">Nenhuma avaria marcada na foto.</p>`;
        return;
      }

      const ul = document.createElement('ul');
      ul.className = "mt-4 space-y-2";

      marks.forEach((mark, index) => {
        const li = document.createElement('li');
        li.className = "flex items-center gap-3 rounded-lg border border-gray-200 bg-white px-3 py-2";

        const options = damageTypes.map(tipo => `<option value="${tipo.key}" ${mark.type === tipo.key ? 'selected' : ''}>${tipo.label}</option>`).join('');

        li.innerHTML = `
          <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border text-[11px] font-semibold tabular-nums" 
                style="border-color: ${getTypeColor(mark.type)}; color: ${getTypeColor(mark.type)};">${index + 1}</span>
          <span class="min-w-0 flex-1 truncate text-[13px] text-gray-900">Avaria ${index + 1}</span>
          <select class="rounded-md border border-gray-200 bg-white px-2 py-1 text-[12px]" onchange="updateMarkType('${mark.id}', this.value)">${options}</select>
          <button type="button" onclick="removeMark('${mark.id}')" class="flex h-7 w-7 items-center justify-center rounded-md text-gray-400 hover:bg-gray-100 hover:text-gray-900"><i data-lucide="x" class="h-4 w-4"></i></button>
        `;
        ul.appendChild(li);
      });

      listContainer.appendChild(ul);
      lucide.createIcons(); 
    }

    window.updateMarkType = (id, newType) => {
      const mark = marks.find(m => m.id === id);
      if (mark) { mark.type = newType; renderAllDamage(); }
    };

    window.removeMark = (id) => {
      marks = marks.filter(m => m.id !== id);
      renderAllDamage();
    };

    function renderAllDamage() {
      renderMarks();
      renderDamageList();
    }

    // Inicialização Básica
    renderDamageButtons();
    renderAllDamage();

  </script>
</body>
</html>
