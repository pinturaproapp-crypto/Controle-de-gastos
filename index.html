<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistoria de Veículo Completa</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Ícones (Lucide) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .map-container {
      position: relative;
      aspect-ratio: 1 / 1;
      width: 100%;
      cursor: crosshair;
      overflow: hidden;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
      background-color: white;
    }
    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid white;
      font-size: 10px;
      font-weight: 600;
      background-color: white;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      pointer-events: none;
      font-family: monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="p-4 bg-gray-50 min-h-screen">

  <div class="max-w-4xl mx-auto p-4 sm:p-6 bg-white rounded-lg shadow-sm space-y-8">
    
    <!-- 1. COMPONENTE VEHICLE FIELDS -->
    <div>
      <div class="mb-4 flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="font-bold text-xl text-gray-900">Identifique-se</h2>
        <span class="text-[10px] uppercase tracking-[0.16em] text-gray-500">Vistoria de entrada</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="vehicle-fields-container">
        <!-- Campos gerados via JS -->
      </div>
    </div>

    <hr class="border-gray-200">

    <!-- 2. COMPONENTE CHECKLIST SECTION -->
    <div id="checklist-sections-container" class="space-y-6">
      <!-- Seções de checklist geradas via JS -->
    </div>

    <hr class="border-gray-200">

    <!-- 3. COMPONENTE DAMAGE MAP -->
    <div>
      <div class="mb-3 flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="font-bold text-xl text-gray-900">Mapa de avarias</h2>
        <span class="text-[10px] uppercase tracking-[0.16em] text-gray-500">Toque no desenho para marcar</span>
      </div>

      <div class="mb-3 flex flex-wrap gap-1.5" id="damage-buttons"></div>

      <div class="map-container" id="damage-map">
        <img 
          src="https://placehold.co/1024x1024/f3f4f6/9ca3af?text=Desenho+do+Carro" 
          alt="Desenho técnico do veículo" 
          class="h-full w-full object-contain"
        >
        <div class="pointer-events-none absolute inset-0" id="markers-container"></div>
      </div>

      <p class="mt-2 text-center text-[11px] text-gray-500">Frente · Lateral · Traseira · Vista Superior</p>
    </div>

    <hr class="border-gray-200">

    <!-- 4. COMPONENTE DAMAGE LIST -->
    <div id="damage-list-container">
      <!-- Lista gerada via JS -->
    </div>

  </div>

  <script>
    // ==========================================
    // DADOS: AVARIAS (damageConfig.js)
    // ==========================================
    const damageTypes = [
      { key: "risco", label: "Risco", color: "#B4791F" },
      { key: "amassado", label: "Amassado", color: "#2F6F8F" },
      { key: "trinca", label: "Trinca", color: "#7A4FA3" },
      { key: "quebrado", label: "Quebrado", color: "#B3402F" },
      { key: "ferrugem", label: "Ferrugem", color: "#8A5A2B" }
    ];

    const getTypeColor = (key) => {
      const found = damageTypes.find(type => type.key === key);
      return found ? found.color : damageTypes[0].color;
    };

    // ==========================================
    // DADOS: CAMPOS DO VEÍCULO (VehicleFields.jsx)
    // ==========================================
    const campos = [
      { key: "placa", label: "Placa", placeholder: "ABC-1D23" },
      { key: "modelo", label: "Veículo / modelo", placeholder: "Gol 1.6 - 2019" },
      { key: "cor", label: "Cor", placeholder: "Prata" },
      { key: "cliente", label: "Cliente", placeholder: "Nome do cliente" },
      { key: "data", label: "Data", type: "date" },
      { key: "km", label: "Quilometragem", placeholder: "84.320" },
      { key: "responsavel", label: "Responsável", placeholder: "Quem conferiu" },
      { key: "os", label: "Ordem de serviço", placeholder: "OS 1042" },
    ];

    // ==========================================
    // DADOS: CHECKLIST REAL (vistoriaEntrada.js)
    // ==========================================
    const checklistData = [
      {
        id: 'secao_1',
        title: 'Documentação e identificação',
        items: [
          { id: 'd1', label: 'Placa e chassi conferidos com o documento' },
          { id: 'd2', label: 'CRLV ou autorização do proprietário conferido' },
          { id: 'd3', label: 'Chave, controle e manual recuperado' },
          { id: 'd4', label: 'Quilometragem registrada no ato da entrega' },
          { id: 'd5', label: 'Nível de combustível anotado' }
        ]
      },
      {
        id: 'secao_2',
        title: 'Lataria e pintura',
        items: [
          { id: 'l1', label: 'Avarias mapeadas e fotografadas (riscos, amassados, trincas)' },
          { id: 'l2', label: 'Para-choques dianteiros e traseiros conferidos' },
          { id: 'l3', label: 'Capô, portas e tampa da porta-malas conferidas' },
          { id: 'l4', label: 'Grau, frisos e emblemas conferidos' },
          { id: 'l5', label: 'Retrovisores e maçanetas conferidas' },
          { id: 'l6', label: 'Pontos de ferrugem e pintura descascados registrados' }
        ]
      },
      {
        id: 'secao_3',
        title: 'Vidros, rodas e iluminação',
        items: [
          { id: 'v1', label: 'Para-brisa e vidros laterais sem trincas' },
          { id: 'v2', label: 'Palhetas de limpadores conferidas' },
          { id: 'v3', label: 'Pneus, rodas e calotas conferidas' },
          { id: 'v4', label: 'Estepe, macaco e chave de roda presentes' },
          { id: 'v5', label: 'Faróis, lanternas e luz de freio funcionando' }
        ]
      },
      {
        id: 'secao_4',
        title: 'Interior e acessórios',
        items: [
          { id: 'i1', label: 'Estofamento, forrações e painéis conferidos' },
          { id: 'i2', label: 'Tapetes e acabamentos internos presentes' },
          { id: 'i3', label: 'Itens pessoais retirados e devoluções ao cliente' },
          { id: 'i4', label: 'Documentos e objetos de valor retirados do veículo' }
        ]
      },
      {
        id: 'secao_5',
        title: 'Mecânica e elétrica',
        items: [
          { id: 'm1', label: 'Nível de óleo, água e fluidos conferidos' },
          { id: 'm2', label: 'Bateria e terminais em ordem' },
          { id: 'm3', label: 'Luzes de painel verificados' },
          { id: 'm4', label: 'Ar condicionado e ventilação testados' },
          { id: 'm5', label: 'Rádio e multimídia testados' },
          { id: 'm6', label: 'Vidros elétricos e trabalhos testados' }
        ]
      },
      {
        id: 'secao_6',
        title: 'Fechamento da entrada',
        items: [
          { id: 'f1', label: 'Cliente ciente das avarias registradas' },
          { id: 'f2', label: 'Orçamento apresentado e aprovado' },
          { id: 'f3', label: 'Fotos anexadas ao processo do veículo' },
          { id: 'f4', label: 'Prazo estimado de entrega combinado' }
        ]
      }
    ];

    // ==========================================
    // ESTADOS GLOBAIS
    // ==========================================
    let vehicleData = {}; 
    let checkedItems = {}; 
    let selectedDamageType = 'risco'; 
    let marks = []; 

    // ==========================================
    // RENDERIZAÇÃO: VEHICLE FIELDS
    // ==========================================
    const vehicleContainer = document.getElementById('vehicle-fields-container');

    function renderVehicleFields() {
      vehicleContainer.innerHTML = '';
      campos.forEach(campo => {
        const label = document.createElement('label');
        label.className = "block";
        
        label.innerHTML = `
          <span class="mb-1.5 block text-[10px] uppercase tracking-[0.16em] text-gray-500">
            ${campo.label}
          </span>
          <input 
            type="${campo.type || 'text'}" 
            value="${vehicleData[campo.key] || ''}" 
            placeholder="${campo.placeholder || ''}"
            oninput="updateVehicleData('${campo.key}', this.value)"
            class="w-full rounded-md border border-gray-200 bg-gray-50 px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-200"
          />
        `;
        vehicleContainer.appendChild(label);
      });
    }

    window.updateVehicleData = function(key, value) {
      vehicleData[key] = value;
    };

    // ==========================================
    // RENDERIZAÇÃO: CHECKLIST SECTION
    // ==========================================
    const checklistContainer = document.getElementById('checklist-sections-container');

    function renderChecklist() {
      checklistContainer.innerHTML = '';

      checklistData.forEach((section, sectionIndex) => {
        const doneCount = section.items.filter(item => checkedItems[item.id]).length;
        const allDone = doneCount === section.items.length;

        const sectionEl = document.createElement('section');
        sectionEl.className = "mb-6 last:mb-0";

        const headerEl = document.createElement('div');
        headerEl.className = "mb-2 flex items-center justify-between gap-3 border-b border-gray-200 pb-2";
        headerEl.innerHTML = `
          <h3 class="flex items-center gap-2.5 font-bold text-lg leading-tight text-gray-900">
            <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-gray-100 text-[10px] tabular-nums text-gray-500">
              ${String(sectionIndex + 1).padStart(2, "0")}
            </span>
            ${section.title}
          </h3>
          <div class="flex shrink-0 items-center gap-3">
            <span class="text-[11px] tabular-nums text-gray-500">${doneCount} / ${section.items.length}</span>
            <button type="button" onclick="toggleAll('${section.id}')" class="text-[10px] uppercase tracking-[0.12em] text-gray-500 hover:text-gray-900 transition-colors">
              ${allDone ? 'Limpar' : 'Marcar todos'}
            </button>
          </div>
        `;

        const ul = document.createElement('ul');
        section.items.forEach(item => {
          const isDone = Boolean(checkedItems[item.id]);
          const li = document.createElement('li');
          li.className = "border-b border-gray-100 last:border-b-0";
          
          li.innerHTML = `
            <label class="flex cursor-pointer items-start gap-3 py-2.5 transition-colors hover:text-gray-900">
              <input 
                type="checkbox" 
                ${isDone ? 'checked' : ''} 
                onchange="toggleItem('${item.id}')"
                class="mt-[3px] h-4 w-4 shrink-0 cursor-pointer accent-gray-900"
              />
              <span class="text-[13.5px] leading-relaxed transition-colors ${isDone ? 'text-gray-400 line-through decoration-gray-400' : 'text-gray-900'}">
                ${item.label}
              </span>
            </label>
          `;
          ul.appendChild(li);
        });

        sectionEl.appendChild(headerEl);
        sectionEl.appendChild(ul);
        checklistContainer.appendChild(sectionEl);
      });
    }

    window.toggleItem = function(itemId) {
      checkedItems[itemId] = !checkedItems[itemId];
      renderChecklist();
    };

    window.toggleAll = function(sectionId) {
      const section = checklistData.find(s => s.id === sectionId);
      const allDone = section.items.every(item => checkedItems[item.id]);
      section.items.forEach(item => { checkedItems[item.id] = !allDone; });
      renderChecklist();
    };

    // ==========================================
    // RENDERIZAÇÃO: DAMAGE MAP & LIST
    // ==========================================
    const buttonsContainer = document.getElementById('damage-buttons');
    const mapContainer = document.getElementById('damage-map');
    const markersContainer = document.getElementById('markers-container');
    const listContainer = document.getElementById('damage-list-container');

    function renderDamageButtons() {
      buttonsContainer.innerHTML = '';
      damageTypes.forEach(tipo => {
        const isActive = tipo.key === selectedDamageType;
        const button = document.createElement('button');
        button.type = 'button';
        button.onclick = () => { selectedDamageType = tipo.key; renderDamageButtons(); };
        
        button.className = `flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-[11px] font-medium transition-all ${
          isActive ? 'border-gray-400 bg-gray-100 text-gray-900' : 'border-gray-200 bg-white text-gray-500 hover:border-gray-300'
        }`;
        
        button.innerHTML = `
          <span class="h-2 w-2 rounded-full" style="background-color: ${tipo.color};"></span>
          ${tipo.label}
        `;
        buttonsContainer.appendChild(button);
      });
    }

    function renderMarks() {
      markersContainer.innerHTML = '';
      marks.forEach((mark, index) => {
        const span = document.createElement('span');
        span.className = 'marker';
        span.style.left = `${mark.x}%`;
        span.style.top = `${mark.y}%`;
        span.style.borderColor = getTypeColor(mark.type);
        span.style.color = getTypeColor(mark.type);
        span.textContent = index + 1;
        markersContainer.appendChild(span);
      });
    }

    function renderDamageList() {
      listContainer.innerHTML = '';

      if (marks.length === 0) {
        listContainer.innerHTML = `
          <p class="mt-4 rounded-lg border border-dashed border-gray-300 px-3 py-3 text-center text-[12px] text-gray-500">
            Nenhuma variação marcada. Escolha o tipo e toque no carro para registrar.
          </p>
        `;
        return;
      }

      const ul = document.createElement('ul');
      ul.className = "mt-4 space-y-2";

      marks.forEach((mark, index) => {
        const li = document.createElement('li');
        li.className = "flex items-center gap-3 rounded-lg border border-gray-200 bg-white px-3 py-2";

        const options = damageTypes.map(tipo => 
          `<option value="${tipo.key}" ${mark.type === tipo.key ? 'selected' : ''}>${tipo.label}</option>`
        ).join('');

        li.innerHTML = `
          <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full border text-[11px] font-semibold tabular-nums" 
                style="border-color: ${getTypeColor(mark.type)}; color: ${getTypeColor(mark.type)};">
            ${index + 1}
          </span>
          <span class="min-w-0 flex-1 truncate text-[13px] text-gray-900">Avaria ${index + 1}</span>
          <select class="rounded-md border border-gray-200 bg-white px-2 py-1 text-[12px] text-gray-900 focus:border-gray-400 focus:outline-none" 
                  onchange="updateMarkType('${mark.id}', this.value)">
            ${options}
          </select>
          <button type="button" onclick="removeMark('${mark.id}')" 
                  class="flex h-7 w-7 items-center justify-center rounded-md text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-900">
            <i data-lucide="x" class="h-4 w-4"></i>
          </button>
        `;
        ul.appendChild(li);
      });

      listContainer.appendChild(ul);
      lucide.createIcons(); 
    }

    mapContainer.addEventListener('click', (event) => {
      const rect = mapContainer.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;
      marks.push({ id: Date.now().toString(), x: parseFloat(x.toFixed(2)), y: parseFloat(y.toFixed(2)), type: selectedDamageType });
      renderAllDamage();
    });

    window.updateMarkType = function(id, newType) {
      const mark = marks.find(m => m.id === id);
      if (mark) { mark.type = newType; renderAllDamage(); }
    };

    window.removeMark = function(id) {
      marks = marks.filter(m => m.id !== id);
      renderAllDamage();
    };

    function renderAllDamage() {
      renderMarks();
      renderDamageList();
    }

    // Inicialização Geral
    renderVehicleFields();
    renderChecklist();
    renderDamageButtons();
    renderAllDamage();

  </script>
</body>
</html>
