<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Checklist de Avarias - App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Configurações do Tema Escuro */
    body {
      background-color: #121212;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 90px; /* Espaço para o menu inferior */
    }
    
    /* Inputs do Tema Escuro */
    .input-dark {
      background-color: #000000;
      border: 1px solid #333;
      color: #fff;
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      width: 100%;
      font-size: 0.875rem;
    }
    .input-dark:focus { outline: none; border-color: #555; }
    .input-dark::placeholder { color: #555; }
    
    /* Botões de Combustível e Pneus */
    .btn-toggle {
      background-color: #1e1e1e;
      border: 1px solid #333;
      color: #9ca3af;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-toggle.active {
      background-color: #333;
      color: #fff;
      border-color: #555;
    }
    
    /* Legenda de Avarias (1 a 6) */
    .legend-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      padding: 0.3rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #000;
      border: none;
      cursor: pointer;
    }

    /* Abas Externo / Interno */
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 0.75rem;
      font-weight: 600;
      color: #6b7280;
      border-radius: 0.5rem;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background-color: #e5e7eb;
      color: #000;
    }

    /* Item do Checklist na parte de baixo */
    .check-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      border-bottom: 1px solid #333;
    }
    
    /* Botões numerados (1 a 6) da linha */
    .num-btn {
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.4rem;
      background-color: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      font-weight: 600;
      font-size: 0.875rem;
      margin-left: 0.25rem;
    }

    /* ===== ESTILOS DO MAPA (CÂMERA) ===== */
    .map-container {
      position: relative;
      aspect-ratio: 4 / 3; 
      width: 100%;
      overflow: hidden;
      border-radius: 0.5rem;
      border: 1px solid #333;
      background-color: #1e1e1e;
      overflow-x: auto; 
      scroll-snap-type: x mandatory;
      display: flex;
    }
    .map-slide {
      min-width: 100%;
      height: 100%;
      scroll-snap-align: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
    }
    .photo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      width: 100%;
      height: 100%;
      background-color: #1e1e1e;
    }
    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .has-photo .photo-placeholder { display: none; }
    .has-photo .photo-img { display: block; }
    
    /* Marcador no Mapa */
    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid white;
      font-size: 11px;
      font-weight: 600;
      background-color: white;
      color: #000;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.5);
      pointer-events: none;
      font-family: monospace;
      z-index: 10;
    }
    .map-container::-webkit-scrollbar { display: none; }
    
    /* Menu Inferior Fixo */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #1e1e1e;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-around;
      padding: 0.75rem 0;
      z-index: 50;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #6b7280;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="flex items-center gap-4 p-4 border-b border-gray-800 bg-[#121212] sticky top-0 z-40">
    <button class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-800 text-white">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <h1 class="text-xl font-bold text-white">Checklist de Avarias</h1>
  </header>

  <main class="p-4 max-w-3xl mx-auto space-y-6">
    
    <!-- 1. DADOS DO VEÍCULO (ESTILO PRINT 1) -->
    <div class="bg-[#1e1e1e] border border-[#333] rounded-xl p-4">
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Linha 1 -->
        <div class="col-span-2 md:col-span-1">
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Nome do Cliente</label>
          <input type="text" id="inp-cliente" class="input-dark" />
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">CPF</label>
          <input type="text" id="inp-cpf" class="input-dark" placeholder="000.000.000-00" />
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Telefone</label>
          <input type="text" id="inp-telefone" class="input-dark" />
        </div>
        
        <!-- Linha 2 -->
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Data Entrada</label>
          <input type="date" id="inp-data" class="input-dark" />
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Nº OS</label>
          <input type="text" id="inp-os" class="input-dark" value="1" />
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Veículo</label>
          <input type="text" id="inp-veiculo" class="input-dark" />
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Placa</label>
          <input type="text" id="inp-placa" class="input-dark" />
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Ano</label>
          <input type="text" id="inp-ano" class="input-dark" placeholder="2021" />
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Cor</label>
          <input type="text" id="inp-cor" class="input-dark" placeholder="Branco" />
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Km</label>
          <input type="text" id="inp-km" class="input-dark" placeholder="00000" />
        </div>
        <div>
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Seguradora</label>
          <input type="text" id="inp-seguradora" class="input-dark" placeholder="Opcional" />
        </div>
        
        <!-- Endereço (linha inteira) -->
        <div class="col-span-2 md:col-span-3">
          <label class="block text-[10px] text-gray-400 uppercase font-bold mb-1">Endereço</label>
          <input type="text" id="inp-endereco" class="input-dark" />
        </div>
      </div>
    </div>

    <!-- 2. COMBUSTÍVEL E PNEUS -->
    <div class="bg-[#1e1e1e] border border-[#333] rounded-xl p-4">
      <!-- Combustível -->
      <label class="block text-[10px] text-gray-400 uppercase font-bold mb-2">Combustível</label>
      <div class="flex flex-wrap gap-2 mb-4">
        <button class="btn-toggle" onclick="selectFuel(this)">R</button>
        <button class="btn-toggle" onclick="selectFuel(this)">1/8</button>
        <button class="btn-toggle" onclick="selectFuel(this)">2/8</button>
        <button class="btn-toggle" onclick="selectFuel(this)">3/8</button>
        <button class="btn-toggle" onclick="selectFuel(this)">4/8</button>
        <button class="btn-toggle" onclick="selectFuel(this)">5/8</button>
        <button class="btn-toggle" onclick="selectFuel(this)">6/8</button>
        <button class="btn-toggle" onclick="selectFuel(this)">7/8</button>
        <button class="btn-toggle" onclick="selectFuel(this)">Cheio</button>
      </div>

      <!-- Pneus -->
      <label class="block text-[10px] text-gray-400 uppercase font-bold mb-2">Pneus</label>
      <div class="grid grid-cols-4 gap-2 text-center">
        <div>
          <label class="block text-[10px] text-gray-500 mb-1">DE</label>
          <select class="input-dark text-center"><option>-</option><option>Bom</option><option>Ruim</option></select>
        </div>
        <div>
          <label class="block text-[10px] text-gray-500 mb-1">DD</label>
          <select class="input-dark text-center"><option>-</option><option>Bom</option><option>Ruim</option></select>
        </div>
        <div>
          <label class="block text-[10px] text-gray-500 mb-1">TE</label>
          <select class="input-dark text-center"><option>-</option><option>Bom</option><option>Ruim</option></select>
        </div>
        <div>
          <label class="block text-[10px] text-gray-500 mb-1">TD</label>
          <select class="input-dark text-center"><option>-</option><option>Bom</option><option>Ruim</option></select>
        </div>
      </div>
    </div>

    <!-- 3. LEGENDA DE AVARIAS -->
    <div class="flex flex-wrap gap-2 justify-center">
      <button class="legend-btn bg-[#F59E0B]">1 Arranhado</button>
      <button class="legend-btn bg-[#F97316]">2 Amassado</button>
      <button class="legend-btn bg-[#EAB308]">3 Trincado</button>
      <button class="legend-btn bg-[#EF4444] text-white">4 Quebrado</button>
      <button class="legend-btn bg-[#DC2626] text-white">5 Falta</button>
      <button class="legend-btn bg-[#10B981] text-white">6 Bom</button>
    </div>

    <!-- 4. ABAS (EXTERNO / INTERNO) -->
    <div class="bg-[#1e1e1e] border border-[#333] rounded-xl p-1 flex mb-2">
      <button class="tab-btn active" onclick="switchTab('externo', this)">Externo <span class="text-xs font-normal text-gray-500 ml-1">0</span></button>
      <button class="tab-btn" onclick="switchTab('interno', this)">Interno <span class="text-xs font-normal text-gray-500 ml-1">0</span></button>
      <button class="tab-btn" onclick="switchTab('resumo', this)">Resumo <span class="text-xs font-normal text-gray-500 ml-1">0</span></button>
    </div>

    <!-- 5. MAPA DE AVARIAS (CÂMERA) -->
    <div class="bg-[#1e1e1e] border border-[#333] rounded-xl p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-white">Mapeamento Fotográfico</h2>
        <span class="text-[10px] uppercase text-gray-500">Deslize para mudar</span>
      </div>

      <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
      
      <div class="map-container" id="damage-map">
        <!-- Frente -->
        <div class="map-slide" data-view="frente">
          <div class="photo-placeholder" onclick="triggerCamera('frente')">
            <i data-lucide="camera" class="w-8 h-8 mb-2"></i>
            <p class="text-sm font-medium">Tirar foto da Frente</p>
          </div>
          <img class="photo-img pointer-events-none" alt="Frente">
          <div class="pointer-events-none absolute inset-0 markers-layer"></div>
        </div>
        <!-- Lateral -->
        <div class="map-slide" data-view="lateral">
          <div class="photo-placeholder" onclick="triggerCamera('lateral')">
            <i data-lucide="camera" class="w-8 h-8 mb-2"></i>
            <p class="text-sm font-medium">Tirar foto da Lateral</p>
          </div>
          <img class="photo-img pointer-events-none" alt="Lateral">
          <div class="pointer-events-none absolute inset-0 markers-layer"></div>
        </div>
        <!-- Traseira -->
        <div class="map-slide" data-view="traseira">
          <div class="photo-placeholder" onclick="triggerCamera('traseira')">
            <i data-lucide="camera" class="w-8 h-8 mb-2"></i>
            <p class="text-sm font-medium">Tirar foto da Traseira</p>
          </div>
          <img class="photo-img pointer-events-none" alt="Traseira">
          <div class="pointer-events-none absolute inset-0 markers-layer"></div>
        </div>
        <!-- Topo -->
        <div class="map-slide" data-view="topo">
          <div class="photo-placeholder" onclick="triggerCamera('topo')">
            <i data-lucide="camera" class="w-8 h-8 mb-2"></i>
            <p class="text-sm font-medium">Tirar foto de Cima</p>
          </div>
          <img class="photo-img pointer-events-none" alt="Topo">
          <div class="pointer-events-none absolute inset-0 markers-layer"></div>
        </div>
      </div>

      <!-- Paginação -->
      <div class="mt-3 flex justify-center items-center gap-2" id="map-pagination">
        <span class="w-2 h-2 rounded-full bg-white"></span>
        <span class="w-2 h-2 rounded-full bg-gray-600"></span>
        <span class="w-2 h-2 rounded-full bg-gray-600"></span>
        <span class="w-2 h-2 rounded-full bg-gray-600"></span>
      </div>
    </div>

    <!-- 6. LISTA DE ITENS DO CHECKLIST (EXTERNO/INTERNO) -->
    <div id="aba-externo" class="tab-content block">
      <!-- Para-choque Dianteiro -->
      <div class="check-item-row">
        <span class="text-sm font-medium">Para-choque Dianteiro</span>
        <div class="flex">
          <button class="num-btn" onclick="markItem(this, 1, '#F59E0B')">1</button>
          <button class="num-btn" onclick="markItem(this, 2, '#F97316')">2</button>
          <button class="num-btn" onclick="markItem(this, 3, '#EAB308')">3</button>
          <button class="num-btn" onclick="markItem(this, 4, '#EF4444')">4</button>
          <button class="num-btn" onclick="markItem(this, 5, '#DC2626')">5</button>
          <button class="num-btn" onclick="markItem(this, 6, '#10B981')">6</button>
        </div>
      </div>
      
      <!-- Para-choque Traseiro -->
      <div class="check-item-row">
        <span class="text-sm font-medium">Para-choque Traseiro</span>
        <div class="flex">
          <button class="num-btn" onclick="markItem(this, 1, '#F59E0B')">1</button>
          <button class="num-btn" onclick="markItem(this, 2, '#F97316')">2</button>
          <button class="num-btn" onclick="markItem(this, 3, '#EAB308')">3</button>
          <button class="num-btn" onclick="markItem(this, 4, '#EF4444')">4</button>
          <button class="num-btn" onclick="markItem(this, 5, '#DC2626')">5</button>
          <button class="num-btn" onclick="markItem(this, 6, '#10B981')">6</button>
        </div>
      </div>

      <!-- Grade Dianteira -->
      <div class="check-item-row">
        <span class="text-sm font-medium">Grade Dianteira</span>
        <div class="flex">
          <button class="num-btn" onclick="markItem(this, 1, '#F59E0B')">1</button>
          <button class="num-btn" onclick="markItem(this, 2, '#F97316')">2</button>
          <button class="num-btn" onclick="markItem(this, 3, '#EAB308')">3</button>
          <button class="num-btn" onclick="markItem(this, 4, '#EF4444')">4</button>
          <button class="num-btn" onclick="markItem(this, 5, '#DC2626')">5</button>
          <button class="num-btn" onclick="markItem(this, 6, '#10B981')">6</button>
        </div>
      </div>
    </div>

    <div id="aba-interno" class="tab-content hidden">
      <!-- Exemplo de item interno -->
      <div class="check-item-row">
        <span class="text-sm font-medium">Bancos</span>
        <div class="flex">
          <button class="num-btn" onclick="markItem(this, 1, '#F59E0B')">1</button>
          <button class="num-btn" onclick="markItem(this, 2, '#F97316')">2</button>
          <button class="num-btn" onclick="markItem(this, 3, '#EAB308')">3</button>
          <button class="num-btn" onclick="markItem(this, 4, '#EF4444')">4</button>
          <button class="num-btn" onclick="markItem(this, 5, '#DC2626')">5</button>
          <button class="num-btn" onclick="markItem(this, 6, '#10B981')">6</button>
        </div>
      </div>
    </div>

  </main>

  <!-- 7. MENU INFERIOR FIXO -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item text-white">
      <i data-lucide="home" class="w-6 h-6 mb-1"></i>
      <span>Início</span>
    </a>
    <a href="#" class="nav-item hover:text-white">
      <i data-lucide="star" class="w-6 h-6 mb-1"></i>
      <span>Favoritos</span>
    </a>
    <a href="#" class="nav-item hover:text-white">
      <i data-lucide="history" class="w-6 h-6 mb-1"></i>
      <span>Histórico</span>
    </a>
    <a href="#" class="nav-item hover:text-white">
      <i data-lucide="sliders" class="w-6 h-6 mb-1"></i>
      <span>Ajustes</span>
    </a>
  </nav>

  <script>
    // Inicializa os Ícones
    lucide.createIcons();

    // Lógica do Combustível
    window.selectFuel = function(btn) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };

    // Lógica das Abas
    window.switchTab = function(tabName, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      document.getElementById(`aba-${tabName}`).classList.remove('hidden');
    };

    // Lógica dos Botões Numerados (1 a 6)
    window.markItem = function(btn, num, color) {
      // Limpa a seleção anterior do grupo
      const parent = btn.parentElement;
      parent.querySelectorAll('.num-btn').forEach(b => {
        b.style.backgroundColor = '#1e1e1e';
        b.style.color = '#fff';
        b.style.borderColor = '#333';
      });
      
      // Aplica a nova cor
      btn.style.backgroundColor = color;
      btn.style.color = '#000';
      btn.style.borderColor = color;
    };

    // ==========================================
    // LÓGICA DO MAPA E CÂMERA (Mantida)
    // ==========================================
    const mapContainer = document.getElementById('damage-map');
    const damageTypes = [
      { key: "arranhado", label: "Arranhado", color: "#F59E0B" },
      { key: "amassado", label: "Amassado", color: "#F97316" },
      { key: "trincado", label: "Trincado", color: "#EAB308" },
      { key: "quebrado", label: "Quebrado", color: "#EF4444" },
      { key: "falta", label: "Falta", color: "#DC2626" },
      { key: "bom", label: "Bom", color: "#10B981" }
    ];
    const getTypeColor = (key) => (damageTypes.find(type => type.key === key) || damageTypes[0]).color;

    let photos = JSON.parse(localStorage.getItem('vistoria_photos')) || { frente: null, lateral: null, traseira: null, topo: null };
    let marks = JSON.parse(localStorage.getItem('vistoria_marks')) || []; 
    let currentPhotoView = 'frente';
    let selectedDamageType = 'arranhado'; // Padrão

    // Como agora temos 6 tipos de danos, vamos simular a seleção usando o primeiro botão da lista de legenda
    document.querySelectorAll('.legend-btn').forEach((btn, idx) => {
      btn.onclick = () => {
        selectedDamageType = damageTypes[idx].key;
        // Adiciona um anel de destaque no botão selecionado
        document.querySelectorAll('.legend-btn').forEach(b => b.style.outline = 'none');
        btn.style.outline = '2px solid white';
      };
    });

    window.triggerCamera = (viewName) => {
      currentPhotoView = viewName;
      document.getElementById('camera-input').click();
    };

    window.handleImageUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          const MAX_HEIGHT = 800;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          photos[currentPhotoView] = compressedBase64;
          
          localStorage.setItem('vistoria_photos', JSON.stringify(photos));

          const slide = document.querySelector(`.map-slide[data-view="${currentPhotoView}"]`);
          if(slide) {
            slide.querySelector('.photo-img').src = compressedBase64;
            slide.classList.add('has-photo');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = ''; 
    };

    // Carrega fotos salvas
    document.querySelectorAll('.map-slide').forEach(slide => {
      const view = slide.getAttribute('data-view');
      if (photos[view]) {
        slide.querySelector('.photo-img').src = photos[view];
        slide.classList.add('has-photo');
      }
    });

    // Adiciona marcador no mapa
    document.querySelectorAll('.map-slide').forEach(slide => {
      slide.addEventListener('click', (event) => {
        if(event.target.closest('.photo-placeholder')) return;
        if(!slide.classList.contains('has-photo')) return;

        const rect = slide.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * 100;
        const y = ((event.clientY - rect.top) / rect.height) * 100;
        
        marks.push({ 
          id: Date.now().toString(), 
          x: parseFloat(x.toFixed(2)), 
          y: parseFloat(y.toFixed(2)), 
          type: selectedDamageType,
          view: slide.getAttribute('data-view')
        });
        
        localStorage.setItem('vistoria_marks', JSON.stringify(marks));
        renderMarks();
      });
    });

    function renderMarks() {
      document.querySelectorAll('.markers-layer').forEach(layer => layer.innerHTML = '');
      
      marks.forEach((mark, index) => {
        const slide = document.querySelector(`.map-slide[data-view="${mark.view}"]`);
        if (slide) {
          const span = document.createElement('span');
          span.className = 'marker';
          span.style.left = `${mark.x}%`;
          span.style.top = `${mark.y}%`;
          span.style.backgroundColor = getTypeColor(mark.type);
          span.style.color = (mark.type === 'bom') ? '#fff' : '#000'; // Texto branco no botão "Bom"
          span.textContent = index + 1;
          slide.querySelector('.markers-layer').appendChild(span);
        }
      });
    }

    // Paginação Scroll
    mapContainer.addEventListener('scroll', () => {
      const scrollLeft = mapContainer.scrollLeft;
      const width = mapContainer.offsetWidth;
      const activeIndex = Math.round(scrollLeft / width);
      
      document.querySelectorAll('#map-pagination span').forEach((dot, idx) => {
        dot.className = idx === activeIndex ? "w-2 h-2 rounded-full bg-white transition-colors" : "w-2 h-2 rounded-full bg-gray-600 transition-colors";
      });
    });

    // Inicializa marcadores salvos
    renderMarks();
  </script>
</body>
</html>
