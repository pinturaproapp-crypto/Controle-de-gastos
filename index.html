<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vistoria de entrada</title>
<style>
:root{color-scheme:dark;--bg:#000;--cd:#141414;--ln:#2b2b2b;--mu:#9a9a9a;--tx:#f2f2f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:60px}
.w{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px}h1{font-size:20px;margin:0}
small,.mu{color:var(--mu)}
.g{display:grid;gap:8px;margin-bottom:10px}.g:last-child{margin-bottom:0}
#hdc{padding:14px}#hd label{font-size:10px;letter-spacing:.06em;white-space:nowrap;min-width:0;display:flex;flex-direction:column}
#hd input{font-size:13px;padding:11px 7px;border-radius:12px;margin-top:5px}
#hd input[data-k=os]{background:#2a2a2a;font-weight:700}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
input,select{width:100%;min-width:0;margin-top:6px;background:#000;color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:12px;font:inherit}
input::placeholder{color:#555}
button{font:inherit;color:var(--tx);background:#222;border:1px solid var(--ln);border-radius:12px;padding:10px 14px;cursor:pointer}
button.p,.ch .on{background:#f2f2f2;color:#000;border-color:#f2f2f2;font-weight:600}
.sm{padding:6px 10px;font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:#000d;backdrop-filter:blur(8px);display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln)}
.bar span{flex:1;font-size:12px;color:var(--mu)}
.r{display:flex;gap:8px;align-items:center}
.ch{display:flex;gap:4px;padding-bottom:8px;margin-bottom:4px}
.ch button{display:flex;align-items:center;justify-content:center;gap:3px;flex:1 1 auto;min-width:0;white-space:nowrap;border-radius:99px;padding:7px 4px;font-size:10.5px}
.ch .ok{border-color:#4ade80}
.bb{width:16px;height:16px;border-radius:50%;border:1.5px solid;background:#000;font:600 10px monospace;font-style:normal;display:flex;align-items:center;justify-content:center;flex:none}
.pb{position:relative;aspect-ratio:4/3;background:#0a0a0a;border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin-bottom:8px}
.pb img{width:100%;height:100%;object-fit:contain;display:block}
.pb.e{display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer}
.mk{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:2px solid;background:#000c;font:600 11px monospace;font-style:normal;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pc{display:grid;gap:5px;margin-bottom:10px}
.pc button{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;padding:5px 3px;font-size:10.5px;line-height:1.2;min-height:36px;overflow-wrap:anywhere}
.pc button[style]{border-width:2px}.pc button .bb{position:absolute;top:-7px;right:-5px}.gl{margin:12px 0 6px}
.pc .on{background:#f2f2f2;color:#000;border-color:#f2f2f2;font-weight:600}
.mk u{position:absolute;left:28px;white-space:nowrap;font:10px sans-serif;color:#fff;background:#000b;padding:2px 5px;border-radius:5px;text-decoration:none}.mk.l u{left:auto;right:28px}
.dm{border-top:1px solid var(--ln);padding:10px 0}.dm .r{margin-bottom:8px}.dm span{flex:1;color:var(--mu)}
.dm select{width:auto;margin:0}.dm input{margin:0 0 8px}
.th{height:56px;border-radius:8px}
#sg{width:100%;height:150px;background:#fff;border-radius:14px;touch-action:none;display:block;margin-bottom:8px}
</style></head><body>
<div id="app">
<div id="ls"><div class="bar"><h1 style="flex:1">Vistorias</h1><button class="p" onclick="nw()">Nova vistoria</button></div><div class="w" id="li"></div></div>
<div id="ed" hidden>
<div class="bar"><button onclick="home()">← Lista</button><span id="st">salvo</span><button class="p" onclick="bx()">Baixar PDF</button><button class="p" style="background:#25d366;border-color:#25d366" onclick="wa()">WhatsApp</button></div>
<div class="w">
<div class="card" id="hdc"><div id="hd"></div></div>

<div class="card" style="padding:14px 10px"><h2>Mapa de avarias</h2><div class="ch" id="tp"></div><div class="ch" id="vw"></div><div id="pa"></div></div>
<div class="card" style="padding:14px 10px"><h2>Peças</h2><p class="mu" style="margin:-6px 0 8px">Escolha uma opção (1 a 5) e toque em cada peça para marcá-la.</p><div class="ch" id="tp2"></div><div id="pl"></div></div>

<div class="card"><h2>Assinatura do cliente</h2><canvas id="sg"></canvas><button class="sm" onclick="clr()">Limpar assinatura</button></div>
</div></div></div>
<input type="file" id="fi" accept="image/*" capture="environment" hidden>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fd=d=>d?d.split('-').reverse().join('/'):'';
const T={arranhado:['Arranhado','#fb923c'],amassado:['Amassado','#38bdf8'],riscado:['Riscado','#facc15'],bom:['Bom','#4ade80'],ruim:['Ruim','#f87171']};
const VW=[['frente','Frente'],['le','Lateral esq.'],['ld','Lateral dir.'],['tras','Traseira'],['topo','Topo'],['painel','Painel / km'],['int','Interior']],VL=Object.fromEntries(VW),SH={frente:'Frente',le:'Esq.',ld:'Dir.',tras:'Traseira',topo:'Topo',painel:'Painel',int:'Interior'};
const F=[['nome','Nome do cliente',0,'Nome do cliente'],['cpf','CPF',0,'000.000.000-00'],['tel','Telefone',0,'(11) 90000-0000'],['data','Data entrada',0,'','date'],['os','Nº OS',0,'','number'],['veic','Veículo',0,'Gol 1.6 - 2019'],['placa','Placa',0,'ABC-1D23'],['ano','Ano',0,'2019'],['cor','Cor',0,'Prata'],['km','KM',0,'84.320'],['seg','Seguradora',0,'Se houver'],['end','Endereço',0,'Rua, número, bairro']];
const R=[[['nome','cpf','tel'],'1.1fr 1fr 1fr'],[['data','os','veic','placa'],'2.6fr 1fr 2fr 2fr'],[['ano','cor','km','seg'],'1.5fr 1.9fr 1.7fr 2.4fr'],[['end'],'1fr']];
const D=v=>v.replace(/\D/g,'');
const MK={cpf:v=>{const d=D(v).slice(0,11);return[d.slice(0,3),d.slice(3,6),d.slice(6,9)].filter(Boolean).join('.')+(d.length>9?'-'+d.slice(9):'')},
tel:v=>{const d=D(v).slice(0,11);return d.length>2?'('+d.slice(0,2)+') '+d.slice(2,7)+(d.length>7?'-'+d.slice(7):''):d},
placa:v=>v.toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,8)};
let db,cur,vw='frente',ty='arranhado',tm,dirty=0,pend,pt='',tb='bom';
const PG=[['Frente',['Para-choque dianteiro','Grade / emblema','Farol esquerdo e direito','Milha / farol de neblina','Capô','Para-brisa']],
['Traseira',['Para-choque traseiro','Tampa do porta-malas','Lanterna esquerda e direita','Vidro traseiro','Placa / emblema']],
['Lateral esquerda e direita',['Para-lama dianteiro','Porta dianteira','Porta traseira','Lateral traseira','Coluna (A, B e C)','Soleira / caixa de ar','Retrovisor','Vidros das portas','Maçanetas','Rodas e calotas (4)']],
['Teto e topo',['Teto','Calhas / borrachas do teto','Antena','Teto solar (se tiver)']],
['Interno',['Painel','Bancos','Forros das portas','Console central','Volante','Tapetes','Porta-malas (assoalho e estepe)']],
['Mecânica e conferência na entrada',['Combustível','Quilometragem','Pneus (4)','Estepe, macaco e triângulo','Acessórios e pertences']]];
/* armazenamento */
const q=(m,f)=>new Promise((ok,no)=>{const t=db.transaction('v',m),r=f(t.objectStore('v'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)});
const rq=indexedDB.open('vistoria',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('v',{keyPath:'id'});rq.onsuccess=()=>{db=rq.result;home()};
function sv(){dirty=1;cur.upd=Date.now();$('#st').textContent='salvando…';clearTimeout(tm);tm=setTimeout(async()=>{await q('readwrite',s=>s.put(cur));dirty=0;$('#st').textContent='salvo'},400)}
const scr=n=>{$('#ls').hidden=n!='ls';$('#ed').hidden=n!='ed'};
/* lista */
async function home(){if(cur&&dirty){clearTimeout(tm);await q('readwrite',s=>s.put(cur))}cur=null;dirty=0;scr('ls');window.scrollTo(0,0);
const a=(await q('readonly',s=>s.getAll())).sort((a,b)=>b.upd-a.upd);
$('#li').innerHTML=a.map(v=>`<div class="card r" onclick="op(${v.id})" style="cursor:pointer"><div style="flex:1"><b>OS ${esc(v.hdr.os)} · ${esc(v.hdr.nome||'Sem nome')}</b><br><small>${esc(v.hdr.veic||'')} ${esc(v.hdr.placa||'')} · ${v.mk.length} avaria(s) · ${fd(v.hdr.data)}</small></div><button class="sm" onclick="event.stopPropagation();del(${v.id})">Excluir</button></div>`).join('')||'<p class="mu">Nenhuma vistoria ainda. Toque em “Nova vistoria”.</p>'}
async function nw(){const a=await q('readonly',s=>s.getAll());op({id:Date.now(),upd:Date.now(),hdr:{data:new Date().toLocaleDateString('sv'),os:a.reduce((m,v)=>Math.max(m,+v.hdr.os||0),0)+1},chk:{},ph:{},mk:[],sig:''})}
async function del(id){if(confirm('Excluir esta vistoria?')){await q('readwrite',s=>s.delete(id));home()}}
async function op(x){cur=typeof x=='object'?x:await q('readonly',s=>s.get(x));dirty=0;vw='frente';scr('ed');$('#st').textContent='salvo';window.scrollTo(0,0);cur.pc=cur.pc||{};const MG={risco:'riscado',trinca:'arranhado',quebrado:'ruim',ferrugem:'ruim',ok:'bom'},mg=k=>MG[k]||k;cur.mk.forEach(m=>m.t=mg(m.t));Object.keys(cur.pc).forEach(p=>cur.pc[p]=mg(cur.pc[p]));hd();pt='';pa();sg()}
/* cabeçalho */
function hd(){$('#hd').innerHTML=R.map(([ks,c])=>`<div class="g" style="grid-template-columns:${c}">${ks.map(k=>{const[,l,,p,t]=F.find(f=>f[0]==k);return`<label>${l}<input data-k="${k}" type="${t||'text'}" ${t=='number'?'inputmode="numeric"':''} placeholder="${p||''}" value="${esc(cur.hdr[k]||'')}"></label>`}).join('')}</div>`).join('')}
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;if(MK[k])e.target.value=MK[k](e.target.value);cur.hdr[k]=e.target.value;sv()});
/* fotos e marcações */
const cmp=(f,M,Q)=>new Promise(r=>{const i=new Image;i.onload=()=>{const s=Math.min(1,M/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(i.src);r(c.toDataURL('image/jpeg',Q))};i.src=URL.createObjectURL(f)});
const pick=cb=>{pend=cb;$('#fi').click()};
$('#fi').onchange=e=>{const f=e.target.files[0];if(f&&pend)pend(f);e.target.value=''};
const mks=v=>cur.mk.map((m,i)=>m.v==v?`<i class="mk${m.x>55?' l':''}" style="left:${m.x}%;top:${m.y}%;color:${T[m.t][1]}">${Object.keys(T).indexOf(m.t)+1}${m.p?`<u>${esc(m.p)}</u>`:''}</i>`:'').join('');
const bc=k=>T[k][1],bn=k=>Object.keys(T).indexOf(k)+1;
function pl(){$('#tp2').innerHTML=Object.entries(T).map(([k,[l]])=>`<button class="${tb==k?'on':''}" onclick="tb='${k}';pa()"><i class="bb" style="color:${bc(k)}">${bn(k)}</i>${l}</button>`).join('');
$('#pl').innerHTML=PG.map(([g,a])=>`<label class="gl">${g}</label><div class="pc" style="grid-template-columns:repeat(${Math.ceil(a.length/2)},1fr)">${a.map(p=>{const k=cur.pc[p];return`<button${k?` style="border-color:${bc(k)}"`:''} data-p="${esc(p)}" onclick="tp(this)">${k?`<i class="bb" style="color:${bc(k)}">${bn(k)}</i>`:''}${p}</button>`}).join('')}</div>`).join('')}
function tp(b){const p=b.dataset.p;if(cur.pc[p]==tb)delete cur.pc[p];else cur.pc[p]=tb;sv();pl()}
function pa(){pl();$('#tp').innerHTML=Object.entries(T).map(([k,[l,c]],n)=>`<button class="${ty==k?'on':''}" onclick="ty='${k}';pa()"><i class="bb" style="color:${c}">${n+1}</i>${l}</button>`).join('');
$('#vw').innerHTML=VW.map(([k])=>`<button class="${vw==k?'on':''} ${cur.ph[k]?'ok':''}" onclick="vw='${k}';pt='';pa()">${SH[k]}</button>`).join('');
const p=cur.ph[vw];
$('#pa').innerHTML=p?`<div class="pb" onclick="add(event)" style="cursor:crosshair"><img src="${p}">${mks(vw)}</div><div class="r"><button class="sm" onclick="foto()">Trocar foto</button><button class="sm" onclick="undo()">Desfazer última</button></div><p class="mu" style="margin:8px 0 0">Toque na foto para marcar uma avaria (${T[ty][0]}).</p>`:`<div class="pb e" onclick="foto()">Tirar foto: ${VL[vw]}</div>`}
function undo(){const i=cur.mk.map(m=>m.v).lastIndexOf(vw);if(i>=0){cur.mk.splice(i,1);sv();pa()}}
function foto(){pick(async f=>{cur.ph[vw]=await cmp(f,1100,.72);sv();pa()})}
function add(e){const r=e.currentTarget.getBoundingClientRect();cur.mk.push({x:+((e.clientX-r.left)/r.width*100).toFixed(1),y:+((e.clientY-r.top)/r.height*100).toFixed(1),t:ty,v:vw,n:'',p:pt});sv();pa()}
/* assinatura */
function sg(){const c=$('#sg'),x=c.getContext('2d');c.width=c.offsetWidth;c.height=150;x.lineWidth=2.5;x.lineCap='round';x.strokeStyle='#000';
if(cur.sig){const i=new Image;i.onload=()=>x.drawImage(i,0,0,c.width,c.height);i.src=cur.sig}
let d=0;const p=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};
c.onpointerup=()=>{if(d){d=0;cur.sig=c.toDataURL();sv()}}}
function clr(){const c=$('#sg');c.getContext('2d').clearRect(0,0,c.width,c.height);cur.sig='';sv()}
/* PDF em arquivo: várias páginas */
const ld=s=>new Promise(r=>{const i=new Image;i.onload=()=>r(i);i.src=s});
const bub=(x,cx,cy,r,col,n)=>{x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle='#000';x.fill();x.strokeStyle=col;x.lineWidth=3;x.stroke();x.fillStyle=col;x.font='bold '+r+'px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText(n,cx,cy+1);x.textAlign='left';x.textBaseline='top'};
const fit=(x,s,w)=>{let t=s;while(x.measureText(t).width>w&&t.length>3)t=t.slice(0,-2);return t==s?s:t+'…'};
const wrap=(x,s,w)=>{const o=[];let l='';String(s).split(' ').forEach(p=>{const t=l?l+' '+p:p;if(x.measureText(t).width>w&&l){o.push(l);l=p}else l=t});if(l)o.push(l);return o};
async function rpt(){
const c=cur,H=c.hdr,W=1240,HT=1754,M=60,pages=[],ks=Object.keys(T);let cv,x,y;
const np=()=>{cv=document.createElement('canvas');cv.width=W;cv.height=HT;x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,HT);x.fillStyle='#000';x.textBaseline='top';pages.push(cv);y=M},need=h=>{if(y+h>HT-M)np()};
np();
x.font='bold 44px sans-serif';x.fillText('Vistoria de entrada',M,y);y+=80;x.font='24px sans-serif';
F.forEach(([k,l],i)=>x.fillText(fit(x,l+': '+(k=='data'?fd(H[k]):H[k]||'—'),357),M+(i%3)*373,y+Math.floor(i/3)*42));
y+=Math.ceil(F.length/3)*42+30;
const ps=VW.filter(([k])=>c.ph[k]);
for(let i=0;i<ps.length;i++){
 if(i%3==0)need(330);
 const[k,l]=ps[i],px=M+(i%3)*380,py=y,by=py+30,im=await ld(c.ph[k]);
 x.fillStyle='#000';x.font='bold 22px sans-serif';x.fillText(l,px,py);x.strokeStyle='#999';x.lineWidth=2;x.strokeRect(px,by,360,270);
 const s=Math.min(360/im.width,270/im.height),dw=im.width*s,dh=im.height*s;x.drawImage(im,px+(360-dw)/2,by+(270-dh)/2,dw,dh);
 c.mk.forEach(m=>{if(m.v!=k)return;const mx=px+m.x*3.6,my=by+m.y*2.7;bub(x,mx,my,16,T[m.t][1],ks.indexOf(m.t)+1);
  if(m.p){x.font='14px sans-serif';const w=x.measureText(m.p).width+10,lx=m.x>55?mx-22-w:mx+22;x.fillStyle='#000';x.fillRect(lx,my-11,w,22);x.fillStyle='#fff';x.textBaseline='middle';x.fillText(m.p,lx+5,my+1);x.textBaseline='top'}});
 if(i%3==2||i==ps.length-1)y+=330}
need(60);ks.forEach((k,n)=>{const lx=M+n*220;bub(x,lx+16,y+12,16,T[k][1],n+1);x.fillStyle='#000';x.font='24px sans-serif';x.fillText(T[k][0],lx+42,y)});y+=60;
const gs=PG.map(([g,a])=>[g,a.filter(p=>c.pc[p])]).filter(([,a])=>a.length);
if(gs.length){need(80);x.fillStyle='#000';x.font='bold 32px sans-serif';x.fillText('Peças marcadas',M,y);y+=48;
 gs.forEach(([g,a])=>{const rows=Math.ceil(a.length/2);need(44+rows*40);
  x.fillStyle='#000';x.font='bold 24px sans-serif';x.fillText(g,M,y);x.fillStyle='#bbb';x.fillRect(M,y+32,W-2*M,2);y+=44;
  a.forEach((p,i)=>{const k=c.pc[p],px=M+(i%2)*580,py=y+Math.floor(i/2)*40;bub(x,px+16,py+18,15,T[k][1],ks.indexOf(k)+1);x.fillStyle='#000';x.font='22px sans-serif';x.fillText(fit(x,p,500),px+44,py+6)});
  y+=rows*40+14})}
need(200);if(c.sig){const im=await ld(c.sig);x.drawImage(im,M,y,im.width/im.height*130,130)}
y+=140;x.fillStyle='#000';x.font='24px sans-serif';x.fillText('Assinatura do cliente: '+(H.nome||'')+' — '+fd(H.data),M,y);
return pages}
function mkpdf(cvs){const e=new TextEncoder(),P=[],off=[];let n=0;
const add=(...a)=>a.forEach(b=>{b=typeof b=='string'?e.encode(b):b;P.push(b);n+=b.length}),o=(i,s)=>{off[i]=n;add(i+' 0 obj\n'+s+'\nendobj\n')};
const N=cvs.length,kids=cvs.map((_,i)=>(3+i*3)+' 0 R').join(' ');
add('%PDF-1.4\n');o(1,'<</Type/Catalog/Pages 2 0 R>>');o(2,'<</Type/Pages/Kids['+kids+']/Count '+N+'>>');
cvs.forEach((cv,i)=>{const jb=Uint8Array.from(atob(cv.toDataURL('image/jpeg',.88).split(',')[1]),c=>c.charCodeAt(0)),pg=3+i*3,im=pg+1,ct=pg+2;
 o(pg,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</I '+im+' 0 R>>>>/Contents '+ct+' 0 R>>');
 off[im]=n;add(im+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jb.length+'>>\nstream\n',jb,'\nendstream\nendobj\n');
 const s='q 595 0 0 842 0 0 cm /I Do Q';o(ct,'<</Length '+s.length+'>>\nstream\n'+s+'\nendstream')});
const xr=n,t=3+N*3;
add('xref\n0 '+t+'\n0000000000 65535 f \n'+Array.from({length:t-1},(_,i)=>String(off[i+1]).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<</Size '+t+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
return new Blob(P,{type:'application/pdf'})}
async function pf(){const s=$('#st'),t=s.textContent;s.textContent='gerando PDF…';const f=new File([mkpdf(await rpt())],'Vistoria OS '+(cur.hdr.os||'')+' '+(cur.hdr.placa||'')+'.pdf',{type:'application/pdf'});s.textContent=t;return f}
async function bx(){const f=await pf(),a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function wa(){const f=await pf();if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:f.name})}catch(e){}}else{await bx();alert('Este navegador não abre o compartilhamento. O PDF foi baixado: anexe-o no WhatsApp.')}}
</script></body></html>
